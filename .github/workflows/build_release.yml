name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller server.py `
            --onefile `
            --noconsole `
            --clean `
            --name "FB_server"

      - name: Create Release Folder
        shell: powershell
        run: |
          $releaseFolder = "FB_Auto_Active_${{ github.ref_name }}"

          if (Test-Path $releaseFolder) {
            Remove-Item $releaseFolder -Recurse -Force
          }

          New-Item -ItemType Directory -Path $releaseFolder

          Copy-Item ".\dist\FB_server.exe" "$releaseFolder\"

          xcopy ".\WS Browser Bridge" "$releaseFolder\Browser_Extension\" /E /I /Y

      - name: Zip Release
        shell: powershell
        run: |
          $zipFile = "FB_Auto_Active_${{ github.ref_name }}.zip"

          if (Test-Path $zipFile) {
            Remove-Item $zipFile -Force
          }

          Compress-Archive `
            -Path "FB_Auto_Active_${{ github.ref_name }}" `
            -DestinationPath $zipFile

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "FB_Auto_Active_${{ github.ref_name }}.zip"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            FB_Auto_Active_${{ github.ref_name }}.zip